name: Build zicOs Buildroot images

on:
  workflow_dispatch:
#  push:
#    paths:
#      - 'os/**'
#      - '.github/workflows/build-buildroot.yml'

concurrency:
  group: buildroot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: zero2w64
            name: zicOs-zero2w64-sdcard
            config: os/zero2w64/defconfig.conf
            dir: os/zero2w64
            artifact: os/zero2w64/output/images/sdcard.img
          - target: rpi4
            name: zicOs-rpi4-sdcard
            config: os/rpi4/defconfig.conf
            dir: os/rpi4
            artifact: os/rpi4/output/images/sdcard.img

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache Buildroot downloads (dl)
        uses: actions/cache@v4
        with:
          path: os/buildroot/dl
          key: buildroot-dl-${{ runner.os }}-${{ hashFiles(matrix.config) }}
          restore-keys: |
            buildroot-dl-${{ runner.os }}-

      - name: Install Buildroot dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            sed make binutils build-essential gcc g++ bash patch gzip bzip2 perl tar cpio unzip rsync file bc wget python3 \
            libncurses5-dev libssl-dev flex bison gperf

      - name: Build image (${{ matrix.target }})
        working-directory: ${{ matrix.dir }}
        run: |
          make initConfig
          make -j"$(nproc)"

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
